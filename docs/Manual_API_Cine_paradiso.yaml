components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token recibido en POST /auth/login. Enviar Authorization: Bearer <token>.'
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: María López
        email:
          type: string
          format: email
          example: maria@example.com
        rol:
          type: string
          enum:
            - cliente
            - administrador
      required:
        - id
        - nombre
        - email
        - rol
    RegistroUsuario:
      type: object
      properties:
        nombre:
          type: string
          example: María López
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          format: password
          minLength: 1
      required:
        - nombre
        - email
        - password
    Credenciales:
      type: object
      properties:
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          format: password
      required:
        - email
        - password
    LoginResultado:
      type: object
      properties:
        token:
          type: string
          description: JWT de acceso
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
        - token
        - usuario
    Correo:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPassword:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          format: password
      required:
        - token
        - password
    CambiarPassword:
      type: object
      properties:
        contrasena_actual:
          type: string
          format: password
        contrasena_nueva:
          type: string
          format: password
      required:
        - contrasena_actual
        - contrasena_nueva
    ActualizarPerfil:
      type: object
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
      description: Enviar nombre y/o email.
    Estado:
      type: object
      properties:
        activo:
          type: boolean
          example: true
      required:
        - activo
    FuncionCartelera:
      type: object
      properties:
        id:
          type: integer
          example: 5
        fecha_hora_proyeccion:
          type: string
          example: '2026-12-04 20:00:00'
        sala:
          type: string
          example: Sala 2
        local:
          type: string
          example: Paradiso Centro
        capacidad:
          type: integer
          example: 50
      description: Vista resumida de función dentro de una película.
    Pelicula:
      type: object
      properties:
        id:
          type: integer
          example: 4
        titulo:
          type: string
          example: El Club de la Pelea
        sinopsis:
          type: string
        poster:
          type: string
          nullable: true
        duracion:
          type: integer
          description: Duración en minutos
          example: 139
        clasificacion:
          type: string
          enum:
            - ATP
            - '+13'
            - '+16'
            - '+18'
        genero:
          type: string
          example: Drama
        activo:
          type: boolean
        eliminada:
          type: boolean
        funciones:
          type: array
          items:
            $ref: '#/components/schemas/FuncionCartelera'
      required:
        - id
        - titulo
    PeliculaCrear:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 150
          example: Mi película
        sinopsis:
          type: string
        poster:
          type: string
          maxLength: 255
        duracion:
          type: integer
          minimum: 1
          example: 115
        clasificacion:
          type: string
          enum:
            - ATP
            - '+13'
            - '+16'
            - '+18'
        genero:
          type: string
          maxLength: 50
          example: Drama
      required:
        - titulo
        - duracion
        - clasificacion
        - genero
    Estreno:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        titulo:
          type: string
        sinopsis:
          type: string
          nullable: true
        poster:
          type: string
          nullable: true
        fecha_estreno:
          type: string
          nullable: true
        genero:
          type: string
          nullable: true
    Sala:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Sala 1
        capacidad:
          type: integer
          minimum: 1
          example: 80
        local:
          type: string
          example: Paradiso Centro
      required:
        - id
        - nombre
        - capacidad
        - local
    SalaCrear:
      type: object
      properties:
        nombre:
          type: string
          example: Sala 3
        capacidad:
          type: integer
          minimum: 1
          example: 70
        local:
          type: string
          example: Paradiso Centro
      required:
        - nombre
        - capacidad
        - local
    SalaActualizar:
      type: object
      properties:
        nombre:
          type: string
        capacidad:
          type: integer
          minimum: 1
        local:
          type: string
      description: Actualización parcial de la sala.
    Funcion:
      type: object
      properties:
        id:
          type: integer
          example: 5
        fecha_hora_proyeccion:
          type: string
          description: Hora local, formato YYYY-MM-DD HH:MM:SS
          example: '2026-12-04 20:00:00'
        activo:
          type: boolean
        eliminada:
          type: boolean
        pelicula_activa:
          type: boolean
          example: true
        pelicula_eliminada:
          type: boolean
          example: false
        cancelada:
          type: boolean
          description: Indica que el cine canceló la función
          example: false
        motivo_cancelacion:
          type: string
          nullable: true
          maxLength: 255
          description: Motivo informado por el administrador, o null si no fue cancelada
          example: Problema técnico en la sala
        precio_entrada:
          type: number
          format: double
          example: 10000
        capacidad:
          type: integer
        entradas_vendidas:
          type: integer
        butacas_libres:
          type: integer
        estado:
          type: string
          enum:
            - en_venta
            - agotada
            - venta_cerrada
            - finalizada
            - eliminada
            - cancelada
        pelicula:
          type: object
          properties:
            id:
              type: integer
            titulo:
              type: string
            duracion:
              type: integer
            activa:
              type: boolean
            eliminada:
              type: boolean
        sala:
          $ref: '#/components/schemas/Sala'
        butacas_ocupadas:
          type: array
          items:
            type: integer
      required:
        - id
        - fecha_hora_proyeccion
        - estado
    FuncionCrear:
      type: object
      properties:
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        id_sala:
          type: integer
          minimum: 1
          example: 2
        fecha_hora_proyeccion:
          type: string
          example: '2026-12-10 19:00:00'
          description: YYYY-MM-DD HH:MM:SS; debe ser futura
      required:
        - id_pelicula
        - id_sala
        - fecha_hora_proyeccion
    FuncionActualizar:
      type: object
      properties:
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        id_sala:
          type: integer
          minimum: 1
          example: 2
        fecha_hora_proyeccion:
          type: string
          example: '2026-12-10 19:00:00'
          description: YYYY-MM-DD HH:MM:SS; debe ser futura
      description: Enviar al menos uno de los tres campos.
    Butaca:
      type: object
      properties:
        numero_butaca:
          type: integer
          example: 1
        estado:
          type: string
          example: disponible
          enum:
            - ocupada
            - disponible
      description: Estado de una butaca calculado por el servicio de ocupación.
      required:
        - numero_butaca
        - estado
    Servicio:
      type: object
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Agua
        descripcion:
          type: string
          nullable: true
        precio:
          type: number
          format: double
          example: 5200
        categoria:
          type: string
          enum:
            - Bebidas
            - Pochoclos
            - Snacks
            - Mejoras de experiencia
        activo:
          type: boolean
        imagen_url:
          type: string
          nullable: true
          description: Data URI de imagen JPG o PNG, cuando exista
      required:
        - id
        - nombre
        - precio
    ServicioCrear:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Agua
        descripcion:
          type: string
        precio:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999999
          example: 5200
        categoria:
          type: string
          enum:
            - Bebidas
            - Pochoclos
            - Snacks
            - Mejoras de experiencia
          default: Snacks
        imagen_url:
          type: string
          description: 'Opcional: data:image/png;base64,... o data:image/jpeg;base64,... (máx. 5 MB)'
      required:
        - nombre
        - precio
    ServicioActualizar:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Agua
        descripcion:
          type: string
        precio:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 99999999
          example: 5200
        categoria:
          type: string
          enum:
            - Bebidas
            - Pochoclos
            - Snacks
            - Mejoras de experiencia
          default: Snacks
        imagen_url:
          type: string
          description: 'Opcional: data:image/png;base64,... o data:image/jpeg;base64,... (máx. 5 MB)'
      required:
        - nombre
        - precio
    CompraServicio:
      type: object
      properties:
        id_servicio:
          type: integer
          minimum: 1
          example: 4
        cantidad:
          type: integer
          minimum: 1
          example: 2
        precio:
          type: number
          format: double
          description: Precio unitario informado en la compra (requerido por la implementación actual)
          minimum: 0
          example: 5200.0
      required:
        - id_servicio
        - cantidad
        - precio
      description: Servicio opcional de la compra. El backend actual exige id_servicio, cantidad y precio por 
        unidad.
    CompraCrear:
      type: object
      properties:
        id_funcion:
          type: integer
          example: 5
        butacas:
          type: array
          items:
            type: integer
            minimum: 1
            example: 1
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/CompraServicio'
        email_contacto:
          type: string
          format: email
          description: 'Opcional: correo de contacto para el comprobante'
      required:
        - id_funcion
        - butacas
    CompraResultado:
      type: object
      properties:
        id_compra:
          type: integer
          example: 8
        mensaje:
          type: string
        codigo_qr_texto:
          type: string
        qr_imagen_base64:
          type: string
          description: Código QR en Base64
        entradas:
          type: array
          items:
            type: object
            properties:
              numero_butaca:
                type: integer
              codigo_qr_texto:
                type: string
              qr_imagen_base64:
                type: string
                nullable: true
      required:
        - id_compra
        - codigo_qr_texto
        - entradas
    ValidacionQR:
      type: object
      properties:
        codigo_qr:
          type: string
          example: CODIGO_QR_DE_LA_COMPRA
        categoria:
          type: string
          enum:
            - entradas
            - vip
            - servicios
            - estacionamiento
        id_detalle:
          type: integer
          description: 'Opcional: detalle del servicio a canjear'
        id_entrada:
          type: integer
          description: 'Opcional: entrada concreta a canjear'
      required:
        - codigo_qr
        - categoria
    Exito:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          description: Resultado variable según endpoint (consultar ejemplos y modelos).
          nullable: true
        message:
          type: string
          example: Operación exitosa
      required:
        - ok
        - data
        - message
    ErrorDetalle:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Solicitud inválida
        details:
          nullable: true
          description: Detalles adicionales de validación, si corresponde.
      required:
        - code
        - message
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorDetalle'
      required:
        - ok
        - error
    DisponibilidadEstacionamiento:
      type: object
      required: [limite, vendidos, disponibles]
      properties:
        limite:
          type: integer
          description: Capacidad máxima de estacionamiento por función
          example: 20
        vendidos:
          type: integer
          description: Plazas vendidas mediante compras con entradas activas
          example: 5
        disponibles:
          type: integer
          description: Plazas todavía disponibles
          example: 15
    CancelacionFuncionResultado:
      type: object
      required: [funcion, motivo, compras_afectadas, entradas_canceladas, total_devuelto, correos_enviados]
      properties:
        funcion:
          $ref: '#/components/schemas/Funcion'
        motivo:
          type: string
          example: Problema técnico en la sala
        compras_afectadas:
          type: integer
          minimum: 0
          example: 2
        entradas_canceladas:
          type: integer
          minimum: 0
          example: 3
        total_devuelto:
          type: number
          format: double
          description: Suma calculada de entradas y servicios de las compras afectadas
          example: 45000.0
        correos_enviados:
          type: integer
          minimum: 0
          description: Cantidad de correos que la función de envío confirmó como enviados
          example: 2
  parameters:
    pelicula_id:
      name: pelicula_id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    funcion_id:
      name: funcion_id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    sala_id:
      name: sala_id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    servicio_id:
      name: servicio_id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    compra_id:
      name: compra_id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    id_usuario:
      name: id_usuario
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
    codigo_qr:
      name: codigo_qr
      in: path
      description: Código QR de la compra
      required: true
      schema:
        type: string
      example: CODIGO_QR
    local:
      name: local
      in: query
      description: Filtrar salas por local
      required: false
      schema:
        type: string
      example: Paradiso Centro
    titulo:
      name: titulo
      in: query
      description: Título para buscar en TMDB; al menos 2 caracteres
      required: true
      schema:
        type: string
      example: Matrix
    incluir_inactivas:
      name: incluir_inactivas
      in: query
      description: Con 1, el administrador puede incluir funciones inactivas
      required: false
      schema:
        type: string
        enum:
          - '1'
      example: '1'
    incluir_inactivos:
      name: incluir_inactivos
      in: query
      description: Con 1, incluye servicios inactivos
      required: false
      schema:
        type: string
        enum:
          - '1'
      example: '1'
    periodo:
      name: periodo
      in: query
      description: Período YYYY-MM del reporte
      required: false
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
      example: 2026-11
    complejo:
      name: complejo
      in: query
      description: Complejo para el reporte
      required: false
      schema:
        type: string
      example: Paradiso Centro
  responses:
    Ok:
      description: Operación exitosa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Exito'
    Created:
      description: Recurso creado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Exito'
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permisos insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto con el estado de los datos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
