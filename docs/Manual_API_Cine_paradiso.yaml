          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: No permite volver a activar una función cancelada. Para otro horario se debe programar una 
        función nueva.
  /funciones/{funcion_id}/cancelar:
    put:
      tags:
        - Funciones
      summary: Cancelar función, calcular devoluciones y avisar a compradores
      operationId: put_cancelar_funcion
      description: |
        Operación exclusiva de administradores. Requiere un motivo de cancelación.
        Cancela las entradas activas, conserva la función en el historial y calcula
        los importes de devolución correspondientes a entradas y servicios.
        Intenta enviar notificaciones por correo electrónico a los compradores.
        El código calcula los montos pero no integra una pasarela de reembolsos.
        No se puede cancelar una función ya cancelada o que ya se proyectó.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/funcion_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Problema técnico en la sala
            example:
              motivo: Problema técnico en la sala
      responses:
        '200':
          description: Función cancelada; se procesó el registro de devolución y se intentó avisar a los 
            compradores
          content:
            application/json:
              schema:
                type: object
                required: [ok, data, message]
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CancelacionFuncionResultado'
                  message:
                    type: string
                    example: Función cancelada, se avisó a los compradores
              example:
                ok: true
                data:
                  funcion:
                    id: 5
                    fecha_hora_proyeccion: '2026-12-04 20:00:00'
                    estado: cancelada
                    cancelada: true
                    motivo_cancelacion: Problema técnico en la sala
                  motivo: Problema técnico en la sala
                  compras_afectadas: 2
                  entradas_canceladas: 3
                  total_devuelto: 45000.0
                  correos_enviados: 2
                message: Función cancelada, se avisó a los compradores
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
