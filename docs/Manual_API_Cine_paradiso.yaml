openapi: 3.0.0
info:
  title: API REST de Cine Paradiso
  version: 1.0.0
  description: API de autenticación, catálogo, funciones, salas, estacionamiento, servicios, compras, 
    cancelación de funciones con devolución, canje de QR y métricas. Documentación de las rutas Flask de 
    Backend_Api (rama develop, noviembre de 2026). La API devuelve JSON normalizados con ok, data y message en
    respuestas exitosas, u ok y error ante fallos.
servers:
  - url: http://127.0.0.1:5000/api
    description: Servidor local de desarrollo (API_BASE_URL=/api)
tags:
  - name: Sistema
    description: Comprobación del estado del servidor
  - name: Autenticación
    description: Registro, ingreso, cierre de sesión y recuperación de contraseña
  - name: Usuarios
    description: Perfil y administración de cuentas
  - name: Películas
    description: Cartelera, películas y búsqueda TMDB
  - name: Funciones
    description: Funciones y su programación
  - name: Salas
    description: Salas y locales
  - name: Butacas
    description: Disponibilidad de asientos
  - name: Estacionamiento
    description: Cupo disponible de estacionamiento por función
  - name: Servicios
    description: Catálogo y gestión de servicios adicionales
  - name: Compras
    description: Compra, consulta y cancelación
  - name: Validación QR
    description: Consulta y canje de tickets y servicios
  - name: Dashboard
    description: Reportes administrativos
paths:
  /ping:
    get:
      tags:
        - Sistema
      summary: Comprobar que el backend está activo
      operationId: get__ping
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exito'
              example:
                ok: true
                data:
                message: Backend Flask running
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un cliente
      operationId: post__auth_register
      description: Crea una cuenta con rol cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuario'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión y obtener un JWT
      operationId: post__auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LoginResultado'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
              example:
                ok: true
                data:
                  token: <JWT>
                  usuario:
                    id: 1
                    nombre: María López
                    email: maria@example.com
                    rol: cliente
                message: Inicio de sesión exitoso
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      operationId: post__auth_logout
      description: La respuesta confirma el cierre; el cliente debe descartar su token.
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Solicitar recuperación de contraseña
      operationId: post__auth_forgot_password
      description: Envía un enlace por correo si la cuenta existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Correo'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/reset-password:
    post:
      tags:
        - Autenticación
      summary: Restablecer contraseña con token recibido
      operationId: post__auth_reset_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/me:
    get:
      tags:
        - Usuarios
      summary: Obtener mi perfil
      operationId: get__auth_usuarios_me
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Usuarios
      summary: Actualizar nombre y/o correo de mi perfil
      operationId: patch__auth_usuarios_me
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfil'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/me/password:
    patch:
      tags:
        - Usuarios
      summary: Cambiar mi contraseña
      operationId: patch__auth_usuarios_me_password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPassword'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/me/historial:
    get:
      tags:
        - Usuarios
      summary: Consultar historial de entradas y servicios
      operationId: get__auth_usuarios_me_historial
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/me/perfil-completo:
    get:
      tags:
        - Usuarios
      summary: Obtener perfil completo para la vista del frontend
      operationId: get__auth_usuarios_me_perfil_completo
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/admins:
    get:
      tags:
        - Usuarios
      summary: Listar administradores
      operationId: get__auth_usuarios_admins
      description: Requiere administrador principal.
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Usuarios
      summary: Habilitar cuenta existente como administrador
      operationId: post__auth_usuarios_admins
      description: Requiere administrador principal.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Correo'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/usuarios/admins/{id_usuario}:
    delete:
      tags:
        - Usuarios
      summary: Dar de baja el rol de administrador
      operationId: delete__auth_usuarios_admins__id_usuario
      description: Revoca el rol de administrador; no elimina el usuario. Requiere administrador principal.
      parameters:
        - $ref: '#/components/parameters/id_usuario'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/cartelera:
    get:
      tags:
        - Películas
      summary: Obtener cartelera con funciones
      operationId: get__peliculas_cartelera
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pelicula'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
              example:
                ok: true
                data:
                  - id: 4
                    titulo: El Club de la Pelea
                    sinopsis: '...'
                    poster: https://image.tmdb.org/t/p/w500/...
                    duracion: 139
                    clasificacion: '+18'
                    genero: Drama
                    activo: true
                    eliminada: false
                    funciones:
                      - id: 5
                        fecha_hora_proyeccion: '2026-12-04 20:00:00'
                        sala: Sala 2
                        local: Paradiso Centro
                        capacidad: 50
                message: Cartelera obtenida exitosamente
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/estrenos:
    get:
      tags:
        - Películas
      summary: Obtener próximos estrenos de TMDB
      operationId: get__peliculas_estrenos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Estreno'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/{pelicula_id}:
    get:
      tags:
        - Películas
      summary: Consultar detalle de película
      operationId: get__peliculas__pelicula_id
      parameters:
        - $ref: '#/components/parameters/pelicula_id'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Pelicula'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Películas
      summary: Editar datos de una película
      operationId: patch__peliculas__pelicula_id
      description: >
        Actualiza solo los campos enviados. No permite cambiar la duración si
        hay funciones futuras o en curso, ni duplicar título y duración.
        El póster admite una URL de hasta 255 caracteres o una imagen PNG/JPEG
        en data URI Base64 de hasta 5 MB.
      parameters:
        - $ref: '#/components/parameters/pelicula_id'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                titulo:
                  type: string
                  maxLength: 150
                sinopsis:
                  type: string
                  nullable: true
                poster:
                  type: string
                  nullable: true
                duracion:
                  type: integer
                  minimum: 1
                clasificacion:
                  type: string
                  enum: [ATP, '+13', '+16', '+18']
                genero:
                  type: string
                  maxLength: 50
                activo:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Películas
      summary: Retirar película del catálogo
      operationId: delete__peliculas__pelicula_id
      description: Baja lógica de la película.
      parameters:
        - $ref: '#/components/parameters/pelicula_id'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/admin:
    get:
      tags:
        - Películas
      summary: Listar películas para administración
      operationId: get__peliculas_admin
      description: Incluye estados de las películas.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pelicula'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas:
    post:
      tags:
        - Películas
      summary: Crear película en el catálogo
      operationId: post__peliculas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaCrear'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/buscar-externa:
    get:
      tags:
        - Películas
      summary: Buscar películas en TMDB
      operationId: get__peliculas_buscar_externa
      description: Devuelve previsualizaciones; no las guarda en MySQL.
      parameters:
        - $ref: '#/components/parameters/titulo'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /peliculas/{pelicula_id}/estado:
    patch:
      tags:
        - Películas
      summary: Activar o desactivar película
      operationId: patch__peliculas__pelicula_id__estado
      parameters:
        - $ref: '#/components/parameters/pelicula_id'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Estado'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /funciones/locales:
    get:
      tags:
        - Funciones
      summary: Listar nombres de locales
      operationId: get__funciones_locales
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /funciones/salas:
    get:
      tags:
        - Funciones
      summary: Listar salas
      operationId: get__funciones_salas
      description: Admite filtrado opcional por local.
      parameters:
        - $ref: '#/components/parameters/local'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Salas
      summary: Crear una sala
      operationId: post__funciones_salas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaCrear'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /funciones:
    get:
      tags:
        - Funciones
      summary: Listar funciones
      operationId: get__funciones
      description: Para incluir las inactivas, usar incluir_inactivas=1 con cuenta administradora.
      parameters:
        - $ref: '#/components/parameters/incluir_inactivas'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Funcion'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Funciones
      summary: Programar nueva función
      operationId: post__funciones
      description: Valida película activa, sala existente, fecha futura y ausencia de superposición (incluye 
        15 minutos de limpieza).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionCrear'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /funciones/{funcion_id}:
    get:
      tags:
        - Funciones
      summary: Consultar detalles de una función
      operationId: get__funciones__funcion_id
      parameters:
        - $ref: '#/components/parameters/funcion_id'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Funcion'
                  message:
                    type: string
                    example: Operación exitosa
                required:
                  - ok
                  - data
                  - message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Funciones
      summary: Modificar una función
      operationId: patch__funciones__funcion_id
      description: No permite modificar funciones pasadas, canceladas o con entradas activas.
      parameters:
        - $ref: '#/components/parameters/funcion_id'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionActualizar'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Funciones
      summary: Dar de baja una función
      operationId: delete__funciones__funcion_id
      parameters:
        - $ref: '#/components/parameters/funcion_id'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
      description: No permite eliminar funciones pasadas, canceladas o con entradas vendidas.
  /funciones/{funcion_id}/estado:
    patch:
      tags:
        - Funciones
      summary: Cambiar estado activo/inactivo
      operationId: patch__funciones__funcion_id__estado
      parameters:
        - $ref: '#/components/parameters/funcion_id'
      security:
